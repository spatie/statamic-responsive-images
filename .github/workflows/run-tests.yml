name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: [12, 13]
        exclude:
          # PHP 8.6 needs Pest 5 / Symfony Process 8, but Testbench 10 requires Process 7.
          - php: 8.6
            laravel: 12

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:^${{ matrix.laravel == 12 && '10.0' || '11.0' }}" --dev --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/pest
